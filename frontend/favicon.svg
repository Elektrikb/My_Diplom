<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)"/>
  <!-- Robot head -->
  <rect x="35" y="35" width="30" height="25" rx="3" fill="white"/>
  <!-- Eyes -->
  <circle cx="42" cy="45" r="3" fill="#667eea"/>
  <circle cx="58" cy="45" r="3" fill="#667eea"/>
  <!-- Antenna -->
  <line x1="50" y1="35" x2="50" y2="25" stroke="white" stroke-width="2"/>
  <circle cx="50" cy="23" r="3" fill="white"/>
  <!-- Mouth -->
  <path d="M 40 55 Q 50 58 60 55" stroke="#667eea" stroke-width="2" fill="none"/>
</svg>
